<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TenBeltz / en</title><link rel="stylesheet" href="../web/design-tokens.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--color-ink);font-family:var(--font-brand)}.slide{display:none;height:calc(100vh - 64px);text-align:center}.slide.active{display:flex;align-items:center;justify-content:center}.slide img{max-width:100%;max-height:100%}nav{height:64px;display:flex;gap:24px;align-items:center;justify-content:center;color:var(--color-white)}button{padding:10px 20px;cursor:pointer}progress{width:160px}@media print{nav{display:none}.slide,.slide.active{display:block;height:auto;break-after:page}.slide img{width:100%}}</style><body><section class="slide" aria-label="1: AI projects
that bloom."><img src="previews/tenbeltz-en-01.svg" alt="AI projects
that bloom."></section><section class="slide" aria-label="2: AI integrated into your product."><img src="previews/tenbeltz-en-02.svg" alt="AI integrated into your product."></section><section class="slide" aria-label="3: Three ways to work together."><img src="previews/tenbeltz-en-03.svg" alt="Three ways to work together."></section><section class="slide" aria-label="4: Define a technical foundation."><img src="previews/tenbeltz-en-04.svg" alt="Define a technical foundation."></section><section class="slide" aria-label="5: Build and deliver to production."><img src="previews/tenbeltz-en-05.svg" alt="Build and deliver to production."></section><section class="slide" aria-label="6: Applied AI training."><img src="previews/tenbeltz-en-06.svg" alt="Applied AI training."></section><section class="slide" aria-label="7: A method with deliverables."><img src="previews/tenbeltz-en-07.svg" alt="A method with deliverables."></section><section class="slide" aria-label="8: Agree on how to evaluate."><img src="previews/tenbeltz-en-08.svg" alt="Agree on how to evaluate."></section><section class="slide" aria-label="9: Clear technical responsibility."><img src="previews/tenbeltz-en-09.svg" alt="Clear technical responsibility."></section><section class="slide" aria-label="10: Evidence with context."><img src="previews/tenbeltz-en-10.svg" alt="Evidence with context."></section><section class="slide" aria-label="11: A useful first conversation."><img src="previews/tenbeltz-en-11.svg" alt="A useful first conversation."></section><section class="slide" aria-label="12: Talk about your project."><img src="previews/tenbeltz-en-12.svg" alt="Talk about your project."></section><nav><button id="prev" aria-label="Anterior">←</button><span id="counter"></span><progress aria-label="Progreso"></progress><button id="next" aria-label="Siguiente">→</button></nav><script>let i=0;const s=[...document.querySelectorAll('.slide')],p=document.querySelector('progress'),counter=document.querySelector('#counter');function show(){s.forEach((e,j)=>e.classList.toggle('active',j===i));p.value=i+1;p.max=s.length;counter.textContent=`${i+1} / ${s.length}`;}document.querySelector('#prev').onclick=()=>{i=Math.max(0,i-1);show()};document.querySelector('#next').onclick=()=>{i=Math.min(s.length-1,i+1);show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){i=Math.min(s.length-1,i+1);show()}if(e.key==='ArrowLeft'){i=Math.max(0,i-1);show()}});show();</script></body></html>
