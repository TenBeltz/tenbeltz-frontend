<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TenBeltz / es</title><link rel="stylesheet" href="../web/design-tokens.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--color-ink);font-family:var(--font-brand)}.slide{display:none;height:calc(100vh - 64px);text-align:center}.slide.active{display:flex;align-items:center;justify-content:center}.slide img{max-width:100%;max-height:100%}nav{height:64px;display:flex;gap:24px;align-items:center;justify-content:center;color:var(--color-white)}button{padding:10px 20px;cursor:pointer}progress{width:160px}@media print{nav{display:none}.slide,.slide.active{display:block;height:auto;break-after:page}.slide img{width:100%}}</style><body><section class="slide" aria-label="1: Proyectos de IA
que florecen."><img src="previews/tenbeltz-es-01.svg" alt="Proyectos de IA
que florecen."></section><section class="slide" aria-label="2: IA integrada en tu producto."><img src="previews/tenbeltz-es-02.svg" alt="IA integrada en tu producto."></section><section class="slide" aria-label="3: Tres formas de trabajar juntos."><img src="previews/tenbeltz-es-03.svg" alt="Tres formas de trabajar juntos."></section><section class="slide" aria-label="4: Definir una base técnica."><img src="previews/tenbeltz-es-04.svg" alt="Definir una base técnica."></section><section class="slide" aria-label="5: Construir y llevar a producción."><img src="previews/tenbeltz-es-05.svg" alt="Construir y llevar a producción."></section><section class="slide" aria-label="6: Formación en IA aplicada."><img src="previews/tenbeltz-es-06.svg" alt="Formación en IA aplicada."></section><section class="slide" aria-label="7: Un método con entregables."><img src="previews/tenbeltz-es-07.svg" alt="Un método con entregables."></section><section class="slide" aria-label="8: Acordar cómo evaluar."><img src="previews/tenbeltz-es-08.svg" alt="Acordar cómo evaluar."></section><section class="slide" aria-label="9: Responsabilidad técnica clara."><img src="previews/tenbeltz-es-09.svg" alt="Responsabilidad técnica clara."></section><section class="slide" aria-label="10: Evidencia con contexto."><img src="previews/tenbeltz-es-10.svg" alt="Evidencia con contexto."></section><section class="slide" aria-label="11: Una primera conversación útil."><img src="previews/tenbeltz-es-11.svg" alt="Una primera conversación útil."></section><section class="slide" aria-label="12: Hablemos de tu proyecto."><img src="previews/tenbeltz-es-12.svg" alt="Hablemos de tu proyecto."></section><nav><button id="prev" aria-label="Anterior">←</button><span id="counter"></span><progress aria-label="Progreso"></progress><button id="next" aria-label="Siguiente">→</button></nav><script>let i=0;const s=[...document.querySelectorAll('.slide')],p=document.querySelector('progress'),counter=document.querySelector('#counter');function show(){s.forEach((e,j)=>e.classList.toggle('active',j===i));p.value=i+1;p.max=s.length;counter.textContent=`${i+1} / ${s.length}`;}document.querySelector('#prev').onclick=()=>{i=Math.max(0,i-1);show()};document.querySelector('#next').onclick=()=>{i=Math.min(s.length-1,i+1);show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){i=Math.min(s.length-1,i+1);show()}if(e.key==='ArrowLeft'){i=Math.max(0,i-1);show()}});show();</script></body></html>
