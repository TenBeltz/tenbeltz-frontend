<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TenBeltz / template</title><link rel="stylesheet" href="../web/design-tokens.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--color-ink);font-family:var(--font-brand)}.slide{display:none;height:calc(100vh - 64px);text-align:center}.slide.active{display:flex;align-items:center;justify-content:center}.slide img{max-width:100%;max-height:100%}nav{height:64px;display:flex;gap:24px;align-items:center;justify-content:center;color:var(--color-white)}button{padding:10px 20px;cursor:pointer}progress{width:160px}@media print{nav{display:none}.slide,.slide.active{display:block;height:auto;break-after:page}.slide img{width:100%}}</style><body><section class="slide" aria-label="1: [Título del proyecto]"><img src="previews/tenbeltz-template-01.svg" alt="[Título del proyecto]"></section><section class="slide" aria-label="2: [Nombre de la sección]"><img src="previews/tenbeltz-template-02.svg" alt="[Nombre de la sección]"></section><section class="slide" aria-label="3: [Una decisión, dos perspectivas]"><img src="previews/tenbeltz-template-03.svg" alt="[Una decisión, dos perspectivas]"></section><section class="slide" aria-label="4: [Tres puntos que recordar]"><img src="previews/tenbeltz-template-04.svg" alt="[Tres puntos que recordar]"></section><section class="slide" aria-label="5: [Proceso y entregables]"><img src="previews/tenbeltz-template-05.svg" alt="[Proceso y entregables]"></section><section class="slide" aria-label="6: [Caso de proyecto]"><img src="previews/tenbeltz-template-06.svg" alt="[Caso de proyecto]"></section><section class="slide" aria-label="7: [Comparación de alternativas]"><img src="previews/tenbeltz-template-07.svg" alt="[Comparación de alternativas]"></section><section class="slide" aria-label="8: [Resultado de evaluación]"><img src="previews/tenbeltz-template-08.svg" alt="[Resultado de evaluación]"></section><section class="slide" aria-label="9: [Captura o diagrama autorizado]"><img src="previews/tenbeltz-template-09.svg" alt="[Captura o diagrama autorizado]"></section><section class="slide" aria-label="10: [Siguiente paso]"><img src="previews/tenbeltz-template-10.svg" alt="[Siguiente paso]"></section><nav><button id="prev" aria-label="Anterior">←</button><span id="counter"></span><progress aria-label="Progreso"></progress><button id="next" aria-label="Siguiente">→</button></nav><script>let i=0;const s=[...document.querySelectorAll('.slide')],p=document.querySelector('progress'),counter=document.querySelector('#counter');function show(){s.forEach((e,j)=>e.classList.toggle('active',j===i));p.value=i+1;p.max=s.length;counter.textContent=`${i+1} / ${s.length}`;}document.querySelector('#prev').onclick=()=>{i=Math.max(0,i-1);show()};document.querySelector('#next').onclick=()=>{i=Math.min(s.length-1,i+1);show()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){i=Math.min(s.length-1,i+1);show()}if(e.key==='ArrowLeft'){i=Math.max(0,i-1);show()}});show();</script></body></html>
